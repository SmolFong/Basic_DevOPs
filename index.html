<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DevOps Automation Dashboard</title>
    <style>
        :root {
            --primary: #00d2ff;
            --secondary: #3a7bd5;
            --success: #00ff88;
            --bg: #0f172a;
        }

        body {
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: radial-gradient(circle at top right, #1e293b, #0f172a);
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        .container {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 3rem;
            border-radius: 24px;
            text-align: center;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            max-width: 600px;
            width: 90%;
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 0.5rem;
            background: linear-gradient(to right, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .status-container {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
            margin-top: 20px;
        }

        .status-dot {
            height: 15px;
            width: 15px;
            background-color: var(--success);
            border-radius: 50%;
            box-shadow: 0 0 20px var(--success);
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(0, 255, 136, 0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 10px rgba(0, 255, 136, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(0, 255, 136, 0); }
        }

        .stats {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 20px;
            margin-top: 40px;
        }

        .stat-card {
            background: rgba(255, 255, 255, 0.03);
            padding: 15px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .stat-value {
            font-size: 1.2rem;
            font-weight: bold;
            display: block;
            color: var(--primary);
        }

        .stat-label {
            font-size: 0.7rem;
            color: #94a3b8;
            text-transform: uppercase;
        }

        footer {
            margin-top: 50px;
            font-size: 0.8rem;
            color: #64748b;
        }

        .highlight {
            color: white;
            border-bottom: 1px solid var(--primary);
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Pipeline Active</h1>
        <p>Hệ thống CI/CD đã được kích hoạt tự động</p>
        
        <div class="status-container">
            <div class="status-dot"></div>
            <span>Hệ thống: <strong style="color: var(--success);">ONLINE</strong></span>
        </div>

        <div class="stats">
            <div class="stat-card">
                <span class="stat-value">SUCCESS</span>
                <span class="stat-label">Build Status</span>
            </div>
            <div class="stat-card">
                <span class="stat-value">GITHUB</span>
                <span class="stat-label">Source</span>
            </div>
            <div class="stat-card">
                <span class="stat-value">NGINX</span>
                <span class="stat-label">Environment</span>
            </div>
        </div>

        <footer>
            Dự án DevOps thực tế - Cấu hình bởi <span class="highlight">Thanh Phong</span><br>
            Cập nhật lần cuối: <span id="current-time"></span>
        </footer>
    </div>

    <script>
        document.getElementById('current-time').innerText = new Date().toLocaleString('vi-VN');
    </script>
</body>
</html>
